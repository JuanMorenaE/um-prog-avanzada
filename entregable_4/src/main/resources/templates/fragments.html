<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#141512">
<title th:text="${title} + ' — SIDEQUEST'">SIDEQUEST</title><link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="icon" th:href="@{/favicon.ico}" sizes="32x32">
<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head><body>
<header class="topbar" th:fragment="header(active)">
<a class="brand" th:href="@{/}" aria-label="SIDEQUEST, inicio"><span class="brand-icon" aria-hidden="true">✳</span> SIDEQUEST<span class="brand-dot">®</span></a>
<nav aria-label="Navegación principal"><a th:href="@{/}" th:classappend="${active == 'catalog'} ? 'active'">Juegos</a><a th:href="@{/generos}" th:classappend="${active == 'genres'} ? 'active'">Géneros</a></nav>
<a class="button small" th:href="@{/juegos/nuevo}">＋ Agregar juego</a>
</header>
<div class="notice" role="status" th:fragment="notice" th:if="${success}" th:text="${success}"></div>
<footer class="footer" th:fragment="footer"><a class="brand" th:href="@{/}">✳ SIDEQUEST</a><p>Catálogo de videojuegos</p></footer>
</body></html>
