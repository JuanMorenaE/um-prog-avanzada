<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Géneros')}"></head>
<body>
    <div class="shell">
        <header th:replace="~{fragments :: header('genres')}"></header>

        <main class="inner-page">
            <div th:replace="~{fragments :: notice}"></div>
            <h1>Géneros</h1>

            <div class="genres-layout">
                <section aria-label="Géneros">
                    <a class="genre-row" th:each="genre, stat : ${genres}" th:href="@{/(genre=${genre.id})}">
                        <span class="genre-number" th:text="${#numbers.formatInteger(stat.count, 2)}"></span>
                        <h2 th:text="${genre.name}"></h2>
                        <span aria-hidden="true">↗</span>
                    </a>
                    <p th:if="${#lists.isEmpty(genres)}">Todavía no hay géneros.</p>
                </section>

                <form class="genre-form editor-form" method="post" th:action="@{/generos}" th:object="${genreForm}">
                    <h2>Nuevo género</h2>
                    <div class="field">
                        <label for="name">Nombre</label>
                        <input id="name" th:field="*{name}" required maxlength="40"
                               placeholder="Por ejemplo, Estrategia">
                        <p class="field-error" th:errors="*{name}"></p>
                    </div>
                    <button class="button light" type="submit">Crear género ＋</button>
                </form>
            </div>
        </main>

        <footer th:replace="~{fragments :: footer}"></footer>
    </div>
</body>
</html>
