<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>

    <g id="jar">
      <rect x="-21" y="-24" width="42" height="10" rx="3" fill="#c2410c"/>
      <rect x="-18" y="-16" width="36" height="40" rx="6" fill="#ea580c"/>
      <text x="0" y="10" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">jar</text>
    </g>
    <g id="db">
      <path d="M-20,-16 v34 a20,6 0 0 0 40,0 v-34" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
      <ellipse cx="0" cy="-16" rx="20" ry="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="0" y="10" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">H2</text>
    </g>
    <g id="folder">
      <path d="M0,2 h7 l2,3 h9 v11 h-18 z" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1400" height="760" fill="#ffffff"/>

  <!-- ============ FILA SUPERIOR ============ -->

  <!-- Desarrollo -->
  <rect x="40" y="90" width="220" height="160" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <rect x="125" y="108" width="50" height="32" rx="3" fill="#fff" stroke="#475569" stroke-width="2.5"/>
  <path d="M113,144 h74 l-6,8 h-62 z" fill="#475569"/>
  <text x="150" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Desarrollo</text>
  <text x="150" y="214" text-anchor="middle" font-size="15" fill="#6b7280">localhost:8081</text>

  <!-- push -->
  <line x1="262" y1="170" x2="336" y2="170" stroke="#64748b" stroke-width="2.5" marker-end="url(#a-gray)"/>
  <text x="299" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">git push</text>

  <!-- GitHub -->
  <rect x="340" y="90" width="200" height="160" rx="14" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <g stroke="#24292f" stroke-width="2.5" fill="#fff">
    <line x1="428" y1="117" x2="428" y2="143"/>
    <path d="M452,129 C452,140 428,134 428,143" fill="none"/>
    <circle cx="428" cy="112" r="5"/>
    <circle cx="428" cy="148" r="5"/>
    <circle cx="452" cy="124" r="5"/>
  </g>
  <text x="440" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">GitHub</text>
  <text x="440" y="214" text-anchor="middle" font-size="14" fill="#6b7280">código + Jenkinsfile</text>

  <!-- pollSCM -->
  <line x1="542" y1="170" x2="616" y2="170" stroke="#64748b" stroke-width="2.5" marker-end="url(#a-gray)"/>
  <text x="579" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">pollSCM</text>
  <text x="579" y="190" text-anchor="middle" font-size="12" fill="#6b7280">cada 1 min</text>

  <!-- Jenkins -->
  <rect x="620" y="50" width="740" height="215" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="645" y="94" font-size="22" font-weight="700" fill="#1e3a8a">Jenkins</text>
  <text x="733" y="94" font-size="15" fill="#6b7280">localhost:8080</text>

  <g font-size="15" font-weight="600" fill="#1f2937" text-anchor="middle">
    <rect x="645" y="135" width="125" height="50" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="707.5" y="166">Checkout</text>
    <rect x="798" y="135" width="125" height="50" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="860.5" y="166">Compilación</text>
    <rect x="951" y="135" width="125" height="50" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="1013.5" y="166">Testing</text>
    <rect x="1104" y="135" width="125" height="50" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="1166.5" y="166">Empaquetado</text>
  </g>
  <g stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)">
    <line x1="771" y1="160" x2="795" y2="160"/>
    <line x1="924" y1="160" x2="948" y2="160"/>
    <line x1="1077" y1="160" x2="1101" y2="160"/>
    <line x1="1230" y1="160" x2="1272" y2="160"/>
  </g>
  <use href="#jar" x="1300" y="160"/>
  <text x="1300" y="207" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">app.jar</text>

  <!-- fallo de tests -->
  <line x1="1013.5" y1="186" x2="1013.5" y2="214" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="1013.5" y="236" text-anchor="middle" font-size="13" font-weight="600" fill="#dc2626">✗ si falla, no se despliega</text>

  <!-- ============ AMBIENTES ============ -->

  <rect x="600" y="358" width="780" height="300" rx="18" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="8 6"/>
  <text x="1362" y="384" text-anchor="end" font-size="14" fill="#6b7280">Ambientes simulados · misma máquina</text>

  <!-- deploy automático -->
  <polyline points="1300,218 1300,328 750,328 750,402" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a-gray)"/>
  <text x="1025" y="319" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">deploy automático</text>

  <!-- UAT -->
  <rect x="620" y="405" width="260" height="215" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="750" y="445" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">UAT</text>
  <text x="750" y="470" text-anchor="middle" font-size="15" fill="#6b7280">localhost:8082</text>
  <use href="#folder" x="684" y="490"/>
  <text x="708" y="506" font-size="14" font-family="Consolas, monospace" fill="#374151">ambientes/uat</text>
  <use href="#jar" x="722" y="568"/>
  <use href="#db" x="782" y="566"/>

  <!-- UAT → aprobación -->
  <line x1="882" y1="500" x2="954" y2="500" stroke="#64748b" stroke-width="2.5" marker-end="url(#a-gray)"/>

  <!-- Aprobación -->
  <circle cx="1000" cy="500" r="42" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <rect x="986" y="483" width="10" height="34" rx="2" fill="#7c3aed"/>
  <rect x="1004" y="483" width="10" height="34" rx="2" fill="#7c3aed"/>
  <text x="1000" y="568" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Aprobación</text>
  <text x="1000" y="588" text-anchor="middle" font-size="13" fill="#6b7280">manual</text>

  <!-- aprobación → producción -->
  <line x1="1044" y1="500" x2="1116" y2="500" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a-green)"/>
  <text x="1080" y="489" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">Aprobar</text>

  <!-- Producción -->
  <rect x="1120" y="405" width="240" height="215" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1240" y="445" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">Producción</text>
  <text x="1240" y="470" text-anchor="middle" font-size="15" fill="#6b7280">localhost:8083</text>
  <use href="#folder" x="1169" y="490"/>
  <text x="1193" y="506" font-size="14" font-family="Consolas, monospace" fill="#374151">ambientes/prod</text>
  <use href="#jar" x="1212" y="568"/>
  <use href="#db" x="1272" y="566"/>

  <!-- rechazo -->
  <polyline points="1000,598 1000,712 150,712 150,256" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a-red)"/>
  <text x="575" y="702" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">Rechazar → corregir → nuevo push</text>

  <!-- leyenda -->
  <g transform="translate(1040,738) scale(0.55)"><use href="#jar"/></g>
  <text x="1058" y="743" font-size="13" fill="#6b7280">mismo .jar</text>
  <g transform="translate(1158,738) scale(0.55)"><use href="#db"/></g>
  <text x="1176" y="743" font-size="13" fill="#6b7280">base propia por ambiente</text>
</svg>
